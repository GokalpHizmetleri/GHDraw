<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GHDraw - Hand-drawn whiteboard</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat&family=Kalam&family=Patrick+Hand&family=Shantell+Sans&family=Playpen+Sans&family=Pangolin&family=Caveat+Brush&family=Amatic+SC&family=Marck+Script&family=Kaushan+Script&family=Dancing+Script&family=Pacifico&family=Merienda&family=Courgette&family=Lobster&family=Bangers&family=Fredoka&family=Baloo+2&family=Righteous&family=Comfortaa&family=Nunito&family=Poppins&family=Inter&family=Rubik&family=Oswald&family=Playfair+Display&family=Lora&family=Merriweather&family=Abril+Fatface&family=Cinzel&family=Courier+Prime&family=Roboto+Mono&family=Space+Mono&display=swap" rel="stylesheet">
<style>
:root{--accent:#6965db;--accent-d:#5b57d1;--sel:#e0dfff;--sel-t:#4a47b1;--hover:#f1f0ff;--panel:#fff;--border:#e9e8f0;--text:#1b1b1f;--muted:#74738a;--canvas:#fff;--shadow:0 0 0 1px rgba(0,0,0,.04),0 2px 6px rgba(20,20,60,.10),0 6px 18px rgba(20,20,60,.06);--ui:"Nunito","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body.dark{--panel:#232329;--border:#3a3a44;--text:#e8e8ee;--muted:#9a99ad;--canvas:#121212;--hover:#33333d;--sel:#403e6a;--sel-t:#d0cfff;--shadow:0 0 0 1px rgba(255,255,255,.05),0 2px 8px rgba(0,0,0,.5)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:var(--ui);color:var(--text);background:var(--canvas);-webkit-user-select:none;user-select:none}
#board{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.panel{position:fixed;z-index:10;background:var(--panel);border-radius:10px;box-shadow:var(--shadow)}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
.ib{width:36px;height:36px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;position:relative;color:var(--text)}
.ib:hover{background:var(--hover)}
.ib.on{background:var(--sel);color:var(--sel-t)}
.ib:disabled{opacity:.35;cursor:default;background:none}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.ib .k{position:absolute;right:3px;bottom:2px;font-size:9px;font-weight:700;opacity:.55}
.sepv{width:1px;height:24px;background:var(--border);margin:0 4px;flex:none}
#top{position:fixed;top:12px;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:0 12px;pointer-events:none;z-index:25}
#top>*{pointer-events:auto}
#tools{position:relative!important;display:flex;align-items:center;padding:4px;gap:2px;margin:0 auto}
#menuWrap{position:relative;display:flex;gap:8px;align-items:center;width:210px}
#menuBtn{background:var(--panel);box-shadow:var(--shadow);width:40px;height:40px;flex:none}
#logo{height:34px;display:block;opacity:.95}
body.dark #logo{filter:invert(1) hue-rotate(180deg)}
#right{width:210px;display:flex;justify-content:flex-end;gap:8px}
.pbtn{background:var(--accent);color:#fff;height:40px;padding:0 16px;border-radius:10px;font-weight:700;font-size:14px;box-shadow:var(--shadow)}
.pbtn:hover{background:var(--accent-d)}
#menu{position:absolute;top:48px;left:0;min-width:230px;padding:6px;display:none;flex-direction:column;z-index:30}
#menu.open{display:flex}
.mi{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;font-size:14px;text-align:left;width:100%}
.mi:hover{background:var(--hover)}
.mi svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mi .sc{margin-left:auto;font-size:12px;color:var(--muted)}
.msep{height:1px;background:var(--border);margin:6px 2px}
#props{left:12px;top:64px;width:224px;max-height:calc(100vh - 150px);overflow:auto;padding:12px;display:none;flex-direction:column;gap:12px;scrollbar-width:thin}
#props.show{display:flex}
#props h4{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw{width:26px;height:26px;border-radius:6px;border:1px solid rgba(0,0,0,.14);position:relative}
.sw.on{outline:2px solid var(--accent);outline-offset:1px}
.sw.tr{background:conic-gradient(#ccc 25%,#fff 0 50%,#ccc 0 75%,#fff 0) 0 0/10px 10px}
.sw.cu{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);overflow:hidden}
.sw.cu input{opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.ob{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:var(--hover);color:var(--text)}
.ob.on{background:var(--sel);color:var(--sel-t);box-shadow:inset 0 0 0 1px var(--accent)}
.ob svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ob.t{font-size:13px;font-weight:700;width:auto;padding:0 9px}
#opac{width:100%;accent-color:var(--accent)}
#fontBtn{width:100%;height:36px;border-radius:8px;background:var(--hover);padding:0 10px;display:flex;align-items:center;justify-content:space-between;font-size:18px}
#fontBtn:after{content:"\25BE";font-size:12px;color:var(--muted)}
#fontList{display:none;margin-top:6px;max-height:240px;overflow:auto;border:1px solid var(--border);border-radius:8px;scrollbar-width:thin}
#fontList.open{display:block}
.fo{display:flex;justify-content:space-between;align-items:baseline;width:100%;text-align:left;padding:5px 10px;font-size:17px;line-height:1.25;gap:6px}.fo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fo:hover{background:var(--hover)}
.fo.on{background:var(--sel);color:var(--sel-t)}
.fo small{font:600 10px var(--ui);color:var(--muted);margin-left:8px;white-space:nowrap}
#fsz{width:64px;height:32px;border-radius:7px;border:1px solid var(--border);background:var(--panel);color:var(--text);padding:0 6px;font-family:inherit}
#bl{left:12px;bottom:12px;display:flex;gap:8px;background:none;box-shadow:none}
.grp{display:flex;align-items:center;background:var(--panel);border-radius:10px;box-shadow:var(--shadow);padding:2px}
#zl{min-width:52px;height:32px;font-size:13px;font-weight:600;border-radius:7px}
#zl:hover{background:var(--hover)}
#br{right:12px;bottom:12px}
#help{width:36px;height:36px;border-radius:50%;font-weight:800;font-size:16px;background:var(--panel);box-shadow:var(--shadow)}
#welcome{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:1;text-align:center;gap:14px;color:var(--muted)}
#welcome img{height:110px;opacity:.9}
body.dark #welcome img{filter:invert(1) hue-rotate(180deg)}
#welcome p{font-family:"Caveat","Kalam",cursive;font-size:26px;line-height:1.25}
#welcome.hide{display:none}
#hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);font-size:12px;color:var(--muted);background:var(--panel);border-radius:8px;box-shadow:var(--shadow);padding:6px 12px;z-index:9;display:none}
#editor{position:fixed;display:none;z-index:20;background:transparent;border:none;outline:1px dashed var(--accent);resize:none;overflow:hidden;white-space:pre;padding:0;margin:0;line-height:1.25;-webkit-user-select:text;user-select:text}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:none;align-items:center;justify-content:center}
#modal.open{display:flex}
#modal .box{background:var(--panel);border-radius:14px;padding:22px 26px;max-width:620px;width:92%;max-height:86vh;overflow:auto;box-shadow:var(--shadow)}
#modal h3{font-size:20px;margin-bottom:12px}
#modal table{width:100%;border-collapse:collapse;font-size:14px}
#modal td{padding:5px 4px;border-bottom:1px solid var(--border)}
#modal td:last-child{text-align:right;font-weight:700;color:var(--sel-t)}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#232329;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;z-index:50;display:none}
@media(max-width:820px){#menuWrap,#right{width:auto}#logo{display:none}#tools{margin:0;flex-wrap:wrap;max-width:calc(100vw - 150px)}#props{top:auto;bottom:60px;max-height:45vh}}
</style>
</head>
<body>
<canvas id="board"></canvas>
<div id="welcome"><img src="logo.svg" alt="GHDraw"><p id="wtxt"></p></div>
<div id="top">
  <div id="menuWrap">
    <button class="ib" id="menuBtn" aria-label="Menu"></button>
    <img id="logo" src="logo.svg" alt="GHDraw">
    <div id="menu" class="panel"></div>
  </div>
  <div id="tools" class="panel"></div>
  <div id="right"><button class="pbtn" id="exportBtn"></button></div>
</div>
<div id="props" class="panel"></div>
<div id="bl" class="panel">
  <div class="grp"><button class="ib" id="zout" style="width:32px;height:32px">-</button><button id="zl">100%</button><button class="ib" id="zin" style="width:32px;height:32px">+</button></div>
  <div class="grp"><button class="ib" id="undo" style="width:32px;height:32px"></button><button class="ib" id="redo" style="width:32px;height:32px"></button></div>
</div>
<div id="br" class="panel" style="background:none;box-shadow:none"><button id="help">?</button></div>
<div id="hint"></div>
<textarea id="editor" spellcheck="false" wrap="off"></textarea>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept=".ghdraw,.json,application/json" style="display:none">

const TOOLS=[['hand','H'],['select','1'],['rect','2'],['diamond','3'],['ellipse','4'],['arrow','5'],['line','6'],['pen','7'],['text','8'],['eraser','9']];

function buildMenu(){

  const items=[['open','open',()=>$('#fileIn').click(),'Ctrl+O'],['save','save',saveFile,'Ctrl+S'],['png','png',exportPNG,'Ctrl+Shift+E'],['clear','trash',clearAll,''],'sep',['grid','grid',()=>{grid=!grid;save();render();buildMenu()},grid?'\u2713':''],['dark','moon',()=>{dark=!dark;document.body.classList.toggle('dark',dark);save();render();buildMenu()},dark?'\u2713':''],['lang','globe',()=>{lang=lang==='tr'?'en':'tr';localStorage.setItem('ghdraw:lang',lang);i18nApply()},''],'sep',['github','gh',()=>window.open('https://github.com/GokalpHizmetleri/GHDraw','_blank'),'']];
  for(const it of items){
    if(it==='sep'){m.appendChild(mk('div','msep'));continue}
    const b=mk('button','mi');b.innerHTML=svg(it[1])+`<span>${t(it[0])}</span><span class="sc">${it[3]}</span>`;
    b.onclick=()=>{m.classList.remove('open');it[2]()};m.appendChild(b);
  }
}
function i18nApply(){
  document.documentElement.lang=lang;
  $('#exportBtn').textContent=t('export');$('#wtxt').innerHTML=t('welcome').replace(/\n/g,'<br>');
  $('#undo').innerHTML=svg('undo');$('#redo').innerHTML=svg('redo');$('#undo').title=t('undo')+' (Ctrl+Z)';$('#redo').title=t('redo')+' (Ctrl+Shift+Z)';
  $('#menuBtn').innerHTML=svg('menu');
  buildMenu();buildTools();buildProps();
}
function toast(s){const e=$('#toast');e.textContent=s;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',1600)}
function openHelp(){
  const b=$('#modalBox');b.innerHTML=`<h3>${t('helpT')}</h3><table>${I18[lang].sc.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table><div style="text-align:right;margin-top:14px"><button class="pbtn" id="mc">${t('close')}</button></div>`;
  $('#modal').classList.add('open');$('#mc').onclick=()=>$('#modal').classList.remove('open');
}
function clearAll(){if(!els.length||confirm(t('confirmClear'))){els=[];sel=new Set();commit();render()}}
function saveFile(){
  const blob=new Blob([JSON.stringify({type:'ghdraw',version:2,elements:els})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ghdraw-'+new Date().toISOString().slice(0,10)+'.ghdraw';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast(t('saved'));
}
$('#fileIn').onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);els=d.elements||[];els.forEach(x=>{if(x.type==='text')measure(x)});sel=new Set();commit();render()}catch(_){toast('Invalid file')}};
  r.readAsText(f);e.target.value='';
};
function exportPNG(){
  if(editing)finishEdit();
  const b=els.length?unionBox(els):{x:0,y:0,w:400,h:300},pad=24,sc=2;
  const c=document.createElement('canvas');c.width=Math.ceil((b.w+pad*2)*sc);c.height=Math.ceil((b.h+pad*2)*sc);
  const x=c.getContext('2d');const wasDark=dark;dark=false;
  x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.scale(sc,sc);x.translate(-b.x+pad,-b.y+pad);
  for(const e of els)drawEl(x,e);dark=wasDark;
  c.toBlob(bl=>{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='ghdraw.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast(t('saved'))});
}

const ed=$('#editor');
function applyEditorStyle(){
  if(!editing)return;
  const e=editing;ed.style.fontFamily=`"${e.font}",var(--ui)`;ed.style.fontSize=e.size*cam.z+'px';ed.style.color=col(e.stroke);ed.style.textAlign=e.align;
  ed.style.left=e.x*cam.z+cam.x+'px';ed.style.top=e.y*cam.z+cam.y+'px';
  sizeEditor();
}
function sizeEditor(){
  ed.style.width='10px';ed.style.height='10px';
  const n=ed.value.split('\n').length,lh=editing.size*1.25*cam.z;
  ed.style.width=Math.max(ed.scrollWidth,editing.size*cam.z*2)+8+'px';ed.style.height=Math.max(n*lh,lh)+4+'px';
}
function startEdit(e,isNew){
  editing=e;e.__new=isNew;ed.value=e.text||'';ed.style.display='block';
  applyEditorStyle();ed.focus();ed.setSelectionRange(ed.value.length,ed.value.length);render();
}
function finishEdit(){
  if(!editing)return;
  const e=editing;editing=null;ed.style.display='none';
  const txt=ed.value,isNew=e.__new;delete e.__new;
  if(!txt.trim()){els=els.filter(x=>x!==e);sel.delete(e.id);if(!isNew)commit();syncUI();render();return}
  e.text=txt;measure(e);
  if(!els.includes(e))els.push(e);
  commit();
  if(!locked&&tool==='text'){setTool('select')}
  sel=new Set([e.id]);syncUI();render();
}
ed.addEventListener('input',()=>{if(editing)sizeEditor()});
ed.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Escape'){e.preventDefault();ed.blur()}});
ed.addEventListener('blur',()=>setTimeout(finishEdit,0));
function newText(x,y){
  startEdit({id:uid(),type:'text',x,y,w:10,h:defaults.size*1.25,text:'',stroke:defaults.stroke,font:defaults.font,size:defaults.size,align:defaults.align,opacity:defaults.opacity,sw:2,seed:1},true);
}
const toW=(sx,sy)=>({x:(sx-cam.x)/cam.z,y:(sy-cam.y)/cam.z});
function zoomAt(sx,sy,nz){nz=Math.max(.1,Math.min(8,nz));const w=toW(sx,sy);cam.z=nz;cam.x=sx-w.x*nz;cam.y=sy-w.y*nz;if(editing)applyEditorStyle();save();render()}
function hitHandle(p){
  const sl=els.filter(e=>sel.has(e.id));if(!sl.length)return null;
  const b=unionBox(sl),tol=9/cam.z;
  for(const h of handles(b))if(Math.abs(p.x-h.x)<=tol&&Math.abs(p.y-h.y)<=tol)return{h:h.n,b};
  return null;
}
function mkEl(type,p){
  const e={id:uid(),type,seed:Math.floor(Math.random()*1e9),stroke:defaults.stroke,sw:defaults.sw,opacity:defaults.opacity,style:defaults.style,rough:defaults.rough};
  if(type==='rect'||type==='diamond'||type==='ellipse')Object.assign(e,{x:p.x,y:p.y,w:0,h:0,bg:defaults.bg,fill:defaults.fill,round:defaults.round});
  else{e.pts=[[p.x,p.y],[p.x,p.y]];if(type==='pen'){e.rough=0;e.style='solid';e.pts=[[p.x,p.y]]}}
  return e;
}
cv.addEventListener('pointerdown',ev=>{
  cv.setPointerCapture(ev.pointerId);
  if(editing)ed.blur();
  const sx=ev.clientX,sy=ev.clientY,p=toW(sx,sy);
  $('#menu').classList.remove('open');if(fontOpen){fontOpen=false;buildProps()}
  if(ev.button===1||space||tool==='hand'){drag={kind:'pan',sx,sy,cx:cam.x,cy:cam.y};cv.style.cursor='grabbing';return}
  if(ev.button!==0)return;
  if(tool==='select'){
    const h=hitHandle(p);
    if(h){drag={kind:'resize',h:h.h,b:h.b,orig:els.filter(e=>sel.has(e.id)).map(clone)};return}
    const e=topAt(p.x,p.y);
    if(e){
      if(ev.shiftKey){if(sel.has(e.id))sel.delete(e.id);else sel.add(e.id)}
      else if(!sel.has(e.id))sel=new Set([e.id]);
      drag={kind:'move',sx:p.x,sy:p.y,moved:false,orig:els.filter(x=>sel.has(x.id)).map(clone)};syncUI();render();return;
    }
    if(!ev.shiftKey)sel=new Set();
    drag={kind:'marquee',x0:p.x,y0:p.y,base:new Set(sel)};syncUI();render();return;
  }
  if(tool==='text'){
    ev.preventDefault();
    const e=topAt(p.x,p.y);
    if(e&&e.type==='text'){sel=new Set([e.id]);startEdit(e,false)}else newText(p.x,p.y);
    return;
  }
  if(tool==='eraser'){erased=new Set();drag={kind:'erase'};eraseAt(p);return}
  drag={kind:'draw',el:mkEl(tool,p),x0:p.x,y0:p.y};sel=new Set();syncUI();render();
});
function eraseAt(p){
  for(let i=els.length-1;i>=0;i--){const e=els[i];if(!erased.has(e.id)&&hit(e,p.x,p.y)){erased.add(e.id);e.__bak=e.opacity;e.opacity=25}}
  render();
}
cv.addEventListener('pointermove',ev=>{
  const sx=ev.clientX,sy=ev.clientY,p=toW(sx,sy);
  if(!drag){
    if(tool==='select'&&!editing){const h=hitHandle(p);cv.style.cursor=h?CUR[h.h]:topAt(p.x,p.y)?'move':'default'}
    return;
  }
  if(drag.kind==='pan'){cam.x=drag.cx+(sx-drag.sx);cam.y=drag.cy+(sy-drag.sy);render();return}
  if(drag.kind==='erase'){eraseAt(p);return}
  if(drag.kind==='draw'){
    const e=drag.el;
    if(e.type==='pen'){const l=e.pts[e.pts.length-1];if(Math.hypot(p.x-l[0],p.y-l[1])>1.2/cam.z)e.pts.push([p.x,p.y])}
    else if(e.pts){
      let x=p.x,y=p.y;
      if(ev.shiftKey){const dx=x-drag.x0,dy=y-drag.y0,a=Math.round(Math.atan2(dy,dx)/(Math.PI/4))*Math.PI/4,d=Math.hypot(dx,dy);x=drag.x0+Math.cos(a)*d;y=drag.y0+Math.sin(a)*d}
      e.pts=[[drag.x0,drag.y0],[x,y]];
    }else{
      let w=p.x-drag.x0,h=p.y-drag.y0;
      if(ev.shiftKey){const m=Math.max(Math.abs(w),Math.abs(h));w=Math.sign(w||1)*m;h=Math.sign(h||1)*m}
      e.x=Math.min(drag.x0,drag.x0+w);e.y=Math.min(drag.y0,drag.y0+h);e.w=Math.abs(w);e.h=Math.abs(h);
    }
    render();return;
  }
  if(drag.kind==='move'){
    const dx=p.x-drag.sx,dy=p.y-drag.sy;if(!drag.moved&&Math.hypot(dx,dy)*cam.z<3)return;drag.moved=true;
    for(const o of drag.orig){const e=els.find(x=>x.id===o.id);if(!e)continue;const c=clone(o);moveEl(c,dx,dy);if(isLin(e))e.pts=c.pts;else{e.x=c.x;e.y=c.y}}
    render();return;
  }
  if(drag.kind==='resize'){doResize(p,ev.shiftKey);render();return}
  if(drag.kind==='marquee'){
    const x=Math.min(drag.x0,p.x),y=Math.min(drag.y0,p.y),w=Math.abs(p.x-drag.x0),h=Math.abs(p.y-drag.y0);
    marquee={x,y,w,h};sel=new Set(drag.base);
    for(const e of els){const b=bbox(e);if(b.x>=x&&b.y>=y&&b.x+b.w<=x+w&&b.y+b.h<=y+h)sel.add(e.id)}
    render();
  }
});
function doResize(p,keep){
  const{h,b,orig}=drag;let l=b.x,r=b.x+b.w,tp=b.y,bt=b.y+b.h;
  const single=orig.length===1&&orig[0].type==='text';
  if(h.includes('w'))l=p.x;if(h.includes('e'))r=p.x;if(h.includes('n'))tp=p.y;if(h.includes('s'))bt=p.y;
  let sx=b.w>1e-6?(r-l)/b.w:1,sy=b.h>1e-6?(bt-tp)/b.h:1;
  const horiz=h.includes('w')||h.includes('e'),vert=h.includes('n')||h.includes('s');
  if(!horiz)sx=(keep||single)?sy:1;
  if(!vert)sy=(keep||single)?sx:1;
  if((keep||single)&&horiz&&vert){const m=Math.max(Math.abs(sx),Math.abs(sy));sx=Math.sign(sx||1)*m;sy=Math.sign(sy||1)*m}
  const ax=h.includes('w')?b.x+b.w:b.x,ay=h.includes('n')?b.y+b.h:b.y;
  const mx=x=>ax+(x-ax)*sx,my=y=>ay+(y-ay)*sy;
  for(const o of orig){
    const e=els.find(x=>x.id===o.id);if(!e)continue;
    if(isLin(e))e.pts=o.pts.map(q=>[mx(q[0]),my(q[1])]);
    else if(e.type==='text'){
      const k=Math.max(.05,Math.abs(sy));e.size=Math.max(6,Math.min(400,Math.round(o.size*k)));measure(e);
      const x1=mx(o.x),y1=my(o.y);e.x=sx<0?x1-e.w:x1;e.y=sy<0?y1-e.h:y1;
    }else{const x1=mx(o.x),x2=mx(o.x+o.w),y1=my(o.y),y2=my(o.y+o.h);e.x=Math.min(x1,x2);e.y=Math.min(y1,y2);e.w=Math.abs(x2-x1);e.h=Math.abs(y2-y1)}
  }
}
function endDrag(){
  if(!drag)return;const d=drag;drag=null;marquee=null;
  cv.style.cursor=cursorFor(tool);
  if(d.kind==='pan'){save();render();return}
  if(d.kind==='erase'){
    const n=erased.size;els=els.filter(e=>!erased.has(e.id));els.forEach(e=>{if('__bak' in e){e.opacity=e.__bak;delete e.__bak}});erased=null;
    if(n){sel=new Set([...sel].filter(id=>els.some(e=>e.id===id)));commit()}render();return;
  }
  if(d.kind==='draw'){
    const e=d.el;let ok=true;
    if(e.pts&&e.type!=='pen')ok=Math.hypot(e.pts[1][0]-e.pts[0][0],e.pts[1][1]-e.pts[0][1])>2;
    else if(!e.pts)ok=e.w>2||e.h>2;
    if(ok){els.push(e);commit();if(!locked){setTool('select');sel=new Set([e.id]);syncUI()}}
    render();return;
  }
  if(d.kind==='move'){if(d.moved)commit();render();return}
  if(d.kind==='resize'){commit();render();return}
  if(d.kind==='marquee'){syncUI();render()}
}
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
cv.addEventListener('dblclick',ev=>{
  if(tool!=='select')return;const p=toW(ev.clientX,ev.clientY),e=topAt(p.x,p.y);
  if(e&&e.type==='text'){sel=new Set([e.id]);startEdit(e,false)}
  else if(!e){setTool('text');newText(p.x,p.y)}
});
cv.addEventListener('wheel',ev=>{
  ev.preventDefault();
  if(ev.ctrlKey||ev.metaKey)zoomAt(ev.clientX,ev.clientY,cam.z*Math.exp(-ev.deltaY*0.01));
  else{cam.x-=ev.shiftKey?ev.deltaY:ev.deltaX;cam.y-=ev.shiftKey?0:ev.deltaY;if(editing)applyEditorStyle();save();render()}
},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
$('#menuBtn').onclick=e=>{e.stopPropagation();$('#menu').classList.toggle('open')};
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#menu,#menuBtn'))$('#menu').classList.remove('open')});
$('#exportBtn').onclick=exportPNG;
$('#undo').onclick=undo;$('#redo').onclick=redo;
$('#zin').onclick=()=>zoomAt(W/2,H/2,cam.z*1.2);$('#zout').onclick=()=>zoomAt(W/2,H/2,cam.z/1.2);
$('#zl').onclick=()=>zoomAt(W/2,H/2,1);
$('#help').onclick=openHelp;$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('open')};
let clipPaste=0;
document.addEventListener('keydown',e=>{
  if(e.target===ed||(e.target.tagName==='INPUT'&&e.target.type==='number'))return;
  const k=e.key.toLowerCase(),mod=e.ctrlKey||e.metaKey;
  if(k===' '){space=true;if(!drag)cv.style.cursor='grab';e.preventDefault();return}
  if(mod){
    if(k==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
    if(k==='y'){e.preventDefault();redo();return}
    if(k==='a'){e.preventDefault();setTool('select');sel=new Set(els.map(x=>x.id));syncUI();render();return}
    if(k==='d'){e.preventDefault();dupSel();return}
    if(k==='c'||k==='x'){clip=els.filter(x=>sel.has(x.id)).map(clone);clipPaste=0;if(k==='x')delSel();return}
    if(k==='v'){if(clip.length){e.preventDefault();clipPaste++;const n=clip.map(c=>{const o=clone(c);o.id=uid();moveEl(o,20*clipPaste,20*clipPaste);return o});els.push(...n);sel=new Set(n.map(x=>x.id));commit();render()}return}
    if(k==='s'){e.preventDefault();saveFile();return}
    if(k==='o'){e.preventDefault();$('#fileIn').click();return}
    if(k==='e'&&e.shiftKey){e.preventDefault();exportPNG();return}
    if(k==='='||k==='+'){e.preventDefault();zoomAt(W/2,H/2,cam.z*1.2);return}
    if(k==='-'){e.preventDefault();zoomAt(W/2,H/2,cam.z/1.2);return}
    if(k==='0'){e.preventDefault();zoomAt(W/2,H/2,1);return}
    return;
  }
  if(k==='delete'||k==='backspace'){if(sel.size){e.preventDefault();delSel()}return}
  if(k==='escape'){sel=new Set();setTool('select');return}
  if(k.startsWith('arrow')&&sel.size){e.preventDefault();const s=e.shiftKey?10:1,dx=k==='arrowleft'?-s:k==='arrowright'?s:0,dy=k==='arrowup'?-s:k==='arrowdown'?s:0;els.forEach(x=>{if(sel.has(x.id))moveEl(x,dx,dy)});clearTimeout(window.__nt);window.__nt=setTimeout(commit,300);render();return}
  const map={v:'select','1':'select',h:'hand',r:'rect','2':'rect',d:'diamond','3':'diamond',o:'ellipse','4':'ellipse',a:'arrow','5':'arrow',l:'line','6':'line',p:'pen','7':'pen',x:'pen',t:'text','8':'text',e:'eraser','9':'eraser'};
  if(k==='q'){locked=!locked;buildTools();return}
  if(k==='+'||k==='='){zoomAt(W/2,H/2,cam.z*1.2);return}
  if(k==='-'){zoomAt(W/2,H/2,cam.z/1.2);return}
  if(k==='?'){openHelp();return}
  if(map[k]){e.preventDefault();setTool(map[k])}
});
document.addEventListener('keyup',e=>{if(e.key===' '){space=false;if(!drag)cv.style.cursor=cursorFor(tool)}});
function resize(){dpr=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;render()}
addEventListener('resize',resize);
load();document.body.classList.toggle('dark',dark);
if(!isFinite(cam.z)||!cam.z)cam={x:0,y:0,z:1};
hist=[snap()];hidx=0;
resize();i18nApply();setTool('select');
const remeasure=()=>{els.forEach(e=>{if(e.type==='text')measure(e)});render()};
Promise.all(FONTS.map(f=>document.fonts.load(`20px "${f}"`).catch(()=>{}))).then(remeasure);
document.fonts.ready.then(remeasure);
window.__ghdraw={get els(){return els},set els(v){els=v;remeasure()},render,commit,setTool,defaults};
})();
