<style>
:root{--accent:#6965db;--accent-d:#5b57d1;--sel:#e0dfff;--sel-t:#4a47b1;--hover:#f1f0ff;--panel:#fff;--border:#e9e8f0;--text:#1b1b1f;--muted:#74738a;--canvas:#fff;--shadow:0 0 0 1px rgba(0,0,0,.04),0 2px 6px rgba(20,20,60,.10),0 6px 18px rgba(20,20,60,.06);--ui:"Nunito","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

*{box-sizing:border-box;margin:0;padding:0}

.aiText{width:100%;min-height:92px;max-height:220px;margin:10px 0;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);font:16px var(--ui);white-space:pre-wrap;user-select:text;-webkit-user-select:text}.aiText[hidden]{display:none}

#lib .lt{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}#lib .lt::-webkit-scrollbar{display:none}@media(pointer:fine){#lib .lt{flex-wrap:wrap;overflow:visible}}#lib .lt.ov{-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}#lib .lt{gap:2px}#lib .lt .tab{flex:none;padding:0 6px;font-size:12.5px}@media(min-width:821px){#lib{width:272px}}
#lib .lcat,#lib .lsz{flex:none}#lib .lsz .tab{flex:1}#lib .ecat{font-size:16px;padding:0 6px}
.lsearch{height:32px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text);padding:0 10px;font:inherit;font-size:13px;width:100%;-webkit-user-select:text;user-select:text;flex:none}
.eg{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));grid-auto-rows:44px;gap:4px;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;padding:2px;min-height:44px;flex:1 1 auto}
.emo{display:flex;align-items:center;justify-content:center;min-width:0;padding:0;font-size:22px;line-height:1.4;height:44px;border-radius:7px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}.emo:hover{background:var(--sel)}
@media(pointer:coarse){#lib .lsearch{min-height:40px}.emo{height:44px}#lib .ecat{min-width:40px}}

#lib.emoji-open{overflow:auto}#lib.emoji-open .lh{flex:none}
@media(max-width:820px){#lib.emoji-open{height:min(56dvh,calc(100dvh - 230px));max-height:calc(100dvh - 230px)}}
@media(max-width:900px) and (max-height:500px){#tools{position:fixed!important;bottom:max(4px,env(safe-area-inset-bottom));left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));top:auto;margin:0;max-width:none;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;scrollbar-width:none;z-index:12}#tools .ib{width:38px;height:38px;flex:none}#bl{bottom:calc(50px + env(safe-area-inset-bottom))}#br{display:none}#props,#lib{top:auto;max-height:calc(100dvh - 132px);bottom:calc(58px + env(safe-area-inset-bottom))}#chatp{left:8px;right:8px;top:auto;bottom:calc(58px + env(safe-area-inset-bottom));width:auto;height:min(42dvh,calc(100dvh - 100px))}#pagebar{top:calc(48px + env(safe-area-inset-top));bottom:auto}#hint{bottom:calc(58px + env(safe-area-inset-bottom))}}

document.addEventListener('keydown',e=>{
  if(e.isComposing||e.target.closest('input,textarea,select,[contenteditable=true]'))return;
  if(presenting){presKey(e);return}
  if(viewOnly&&!$('#modal').classList.contains('open')){viewKey(e);return}
  if($('#modal').classList.contains('open')){if(e.key==='Escape')closeModal();return;}
  const k=e.key.toLowerCase(),mod=e.ctrlKey||e.metaKey;
  if(k===' '){space=true;if(!drag)cv.style.cursor='grab';e.preventDefault();return}
  if(mod){
    if(k==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
    if(k==='y'){e.preventDefault();redo();return}
    if(k==='p'&&e.shiftKey){e.preventDefault();startPresent();return}
    if(k==='a'){e.preventDefault();setTool('select');sel=new Set(els.map(x=>x.id));syncUI();render();return}
    if(k==='d'){e.preventDefault();dupSel();return}
    if(k==='c'||k==='x'){clip=els.filter(x=>sel.has(x.id)).map(clone);clipPaste=0;if(k==='x')delSel();return}
    if(k==='v'){if(clip.length){e.preventDefault();clipPaste++;const n=cloneEls(clip,20*clipPaste,20*clipPaste);els.push(...n);sel=new Set(n.map(x=>x.id));commit();render()}return}
    if(k==='g'){e.preventDefault();groupSel(e.shiftKey);return}
    if(k==='s'){e.preventDefault();saveFile();return}
    if(k==='o'){e.preventDefault();$('#fileIn').click();return}
    if(k==='e'&&e.shiftKey){e.preventDefault();exportPNG();return}
    if(k==='='||k==='+'){e.preventDefault();zoomAt(W/2,H/2,cam.z*1.2);return}
    if(k==='-'){e.preventDefault();zoomAt(W/2,H/2,cam.z/1.2);return}
    if(k==='0'){e.preventDefault();zoomAt(W/2,H/2,1);return}
    return;
  }
  if(k==='delete'||k==='backspace'){if(sel.size){e.preventDefault();delSel()}return}
  if(k==='escape'){sel=new Set();setTool('select');return}
  if(k.startsWith('arrow')&&sel.size){e.preventDefault();const s=e.shiftKey?10:1,dx=k==='arrowleft'?-s:k==='arrowright'?s:0,dy=k==='arrowup'?-s:k==='arrowdown'?s:0;detachFree();els.forEach(x=>{if(sel.has(x.id))moveEl(x,dx,dy)});clearTimeout(window.__nt);window.__nt=setTimeout(commit,300);render();return}
  const map={n:'note',m:'comment',v:'select','1':'select',h:'hand',r:'rect','2':'rect',d:'diamond','3':'diamond',o:'ellipse','4':'ellipse',a:'arrow','5':'arrow',l:'line','6':'line',p:'pen','7':'pen',x:'pen',t:'text','8':'text',e:'eraser','9':'eraser'};
  if(k==='b'){toggleLib();return}
  if(k==='+'||k==='='){zoomAt(W/2,H/2,cam.z*1.2);return}
  if(k==='-'){zoomAt(W/2,H/2,cam.z/1.2);return}
  if(k==='?'){openHelp();return}
  if(map[k]){e.preventDefault();setTool(map[k])}
});

function collabPush(){
  if(!collabOn||!conns.length)return;

  for(const e of els){
    if('__bak' in e){if(lastSent.has(e.id))cur.set(e.id,lastSent.get(e.id));continue}

  if(isHost){clearTimeout(remoteSaveT);remoteSaveT=setTimeout(()=>{if(collabOn&&isHost)save()},400)}

function onMsg(raw,from){

    setLast();hist=[snap()];hidx=0;syncUI();render();toast(L2('Ortak çizime bağlandın','Connected to the shared board'));
  }else if(m.t==='upd'){applyUpd(m);if(isHost)bcast(m,from)}
  else if(m.t==='cur'){remoteCur.set(m.id,{x:m.x,y:m.y,n:m.n,c:m.c,ts:Date.now()});if(isHost)bcast(m,from);render()}

function wrapText(c,text,maxW){
  const out=[];
  for(const para of String(text).split('\n')){
    let line='';
    for(const word of para.split(/(\s+)/)){
      if(!word)continue;
      if(c.measureText(line+word).width<=maxW||!line.trim()&&c.measureText(word).width<=maxW){line+=word;continue}
      if(line.trim())out.push(line.trimEnd());
      line='';
      let w=word.trimStart();
      while(c.measureText(w).width>maxW&&w.length>1){let k=w.length-1;while(k>1&&c.measureText(w.slice(0,k)).width>maxW)k--;out.push(w.slice(0,k));w=w.slice(k)}
      line=w;
    }
    out.push(line.trimEnd());
  }
  return out;
}
function drawNoteText(c,e){

    c.fillStyle='#1e1e1e';let lines=wrapText(c,e.txt,e.w-pad*2);
    if(lines.length>max){lines=lines.slice(0,max);lines[max-1]=lines[max-1].replace(/.{0,2}$/,'')+'...'}

  c.restore();
}

    const upd=()=>{bs.textContent=st.run?L2('Duraklat','Pause'):L2('Başlat','Start')};
    bs.onclick=()=>{if(st.run){st.left=Math.max(0,Math.ceil((st.end-Date.now())/1000));st.run=false;clearInterval(w.iv)}else{if(st.left<=0)st.left=Math.max(1,inp.value|0)*60;st.end=Date.now()+st.left*1000;st.run=true;w.iv=setInterval(show,250)}upd();show()};
    br.onclick=()=>{st.run=false;clearInterval(w.iv);st.left=Math.max(1,inp.value|0)*60;upd();show()};
    inp.onchange=()=>{st.mins=Math.max(1,inp.value|0);if(!st.run){st.left=st.mins*60;show()}};
    upd();show();if(st.run)w.iv=setInterval(show,250)}
  else if(k==='todo'){const ul=el.querySelector('ul'),inp=el.querySelector('.wadd input');
    const load=()=>{try{return JSON.parse(localStorage.getItem('ghdraw:todo')||'[]')}catch(e){return[]}};
    const persist=a=>localStorage.setItem('ghdraw:todo',JSON.stringify(a));
    const draw=()=>{const a=load();ul.innerHTML='';a.forEach((it,i)=>{const li=document.createElement('li');if(it.d)li.className='done';
      const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!it.d;cb.onchange=()=>{it.d=cb.checked;persist(a);draw()};
      const sp=document.createElement('span');sp.textContent=it.t;
      const del=document.createElement('button');del.className='wdel';del.textContent='\u00d7';del.onclick=()=>{a.splice(i,1);persist(a);draw()};
      li.append(cb,sp,del);ul.appendChild(li)})};
    const add=()=>{const v=inp.value.trim();if(!v)return;const a=load();a.push({t:v,d:false});persist(a);inp.value='';draw()};
    el.querySelector('.wadd .wbtn').onclick=add;inp.onkeydown=e=>{if(e.key==='Enter')add()};
    draw()}
}
const smatch=location.hash.match(/share=([a-f0-9]{32})/),vmatch=location.hash.match(/view=([\w-]+)/);if(vmatch||smatch)viewOnly=true;
if(!viewOnly)load();document.body.classList.toggle('dark',dark);
if(!isFinite(cam.z)||!cam.z)cam={x:0,y:0,z:1};cam=clampBoardCamera(cam);
hist=[snap()];hidx=0;
resize();if(!viewOnly)startAt100();i18nApply();setTool('select');buildPages();if(viewOnly)startViewer(smatch?'cloud:'+smatch[1]:vmatch[1]);
const remeasure=()=>{els.forEach(e=>{if(e.type==='text')measure(e)});render()};
Promise.all(FONTS.map(f=>document.fonts.load(`20px "${f}"`).catch(()=>{}))).then(remeasure);
document.fonts.ready.then(remeasure);
{const m=viewOnly?null:location.hash.match(/room=([\w-]+)/);if(m){const saved=localStorage.getItem('ghdraw:hostRoom');if(saved===m[1]){collabStart()}else{toast(L2('Ortak çizime bağlanıyor...','Joining the shared board...'));collabJoin(m[1])}}}
{const m=location.hash.match(/collab=([a-f0-9]{32})/);if(m){cloudOwner=localStorage.getItem('ghdraw:cloudOwner:'+m[1]);cloudJoin(m[1],!!cloudOwner)}}

window.__ghdraw={get els(){return els},set els(v){els=v;remeasure()},render,commit,setTool,defaults};
})();
