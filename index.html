<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GHDraw - Hand-drawn whiteboard</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat&family=Kalam&family=Patrick+Hand&family=Shantell+Sans&family=Playpen+Sans&family=Pangolin&family=Caveat+Brush&family=Amatic+SC&family=Marck+Script&family=Kaushan+Script&family=Dancing+Script&family=Pacifico&family=Merienda&family=Courgette&family=Lobster&family=Bangers&family=Fredoka&family=Baloo+2&family=Righteous&family=Comfortaa&family=Nunito&family=Poppins&family=Inter&family=Rubik&family=Oswald&family=Playfair+Display&family=Lora&family=Merriweather&family=Abril+Fatface&family=Cinzel&family=Courier+Prime&family=Roboto+Mono&family=Space+Mono&display=swap" rel="stylesheet">
<style>
:root{--accent:#6965db;--accent-d:#5b57d1;--sel:#e0dfff;--sel-t:#4a47b1;--hover:#f1f0ff;--panel:#fff;--border:#e9e8f0;--text:#1b1b1f;--muted:#74738a;--canvas:#fff;--shadow:0 0 0 1px rgba(0,0,0,.04),0 2px 6px rgba(20,20,60,.10),0 6px 18px rgba(20,20,60,.06);--ui:"Nunito","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body.dark{--panel:#232329;--border:#3a3a44;--text:#e8e8ee;--muted:#9a99ad;--canvas:#121212;--hover:#33333d;--sel:#403e6a;--sel-t:#d0cfff;--shadow:0 0 0 1px rgba(255,255,255,.05),0 2px 8px rgba(0,0,0,.5)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:var(--ui);color:var(--text);background:var(--canvas);-webkit-user-select:none;user-select:none}
#board{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.panel{position:fixed;z-index:10;background:var(--panel);border-radius:10px;box-shadow:var(--shadow)}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
.ib{width:36px;height:36px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;position:relative;color:var(--text)}
.ib:hover{background:var(--hover)}
.ib.on{background:var(--sel);color:var(--sel-t)}
.ib:disabled{opacity:.35;cursor:default;background:none}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.ib .k{position:absolute;right:3px;bottom:2px;font-size:9px;font-weight:700;opacity:.55}
.sepv{width:1px;height:24px;background:var(--border);margin:0 4px;flex:none}
#top{position:fixed;top:12px;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:0 12px;pointer-events:none;z-index:25}
#top>*{pointer-events:auto}
#tools{position:relative!important;display:flex;align-items:center;padding:4px;gap:2px;margin:0 auto}
#menuWrap{position:relative;display:flex;gap:8px;align-items:center;width:210px}
#menuBtn{background:var(--panel);box-shadow:var(--shadow);width:40px;height:40px;flex:none}
#logo{height:34px;display:block;opacity:.95}
body.dark #logo{filter:invert(1) hue-rotate(180deg)}
#right{width:auto;min-width:210px;display:flex;justify-content:flex-end;gap:8px}
.pbtn{background:var(--accent);color:#fff;height:40px;padding:0 16px;border-radius:10px;font-weight:700;font-size:14px;box-shadow:var(--shadow)}
.pbtn:hover{background:var(--accent-d)}
#menu{position:absolute;top:48px;left:0;min-width:230px;padding:6px;display:none;flex-direction:column;z-index:30}
#menu.open{display:flex}
.mi{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;font-size:14px;text-align:left;width:100%}
.mi:hover{background:var(--hover)}
.mi svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mi .sc{margin-left:auto;font-size:12px;color:var(--muted)}
.msep{height:1px;background:var(--border);margin:6px 2px}
#props{left:12px;top:64px;width:224px;max-height:calc(100vh - 150px);overflow:auto;padding:12px;display:none;flex-direction:column;gap:12px;scrollbar-width:thin}
#props.show{display:flex}
#props h4{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw{width:26px;height:26px;border-radius:6px;border:1px solid rgba(0,0,0,.14);position:relative}
.sw.on{outline:2px solid var(--accent);outline-offset:1px}
.sw.tr{background:conic-gradient(#ccc 25%,#fff 0 50%,#ccc 0 75%,#fff 0) 0 0/10px 10px}
.sw.cu{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);overflow:hidden}
.sw.cu input{opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.ob{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:var(--hover);color:var(--text)}
.ob.on{background:var(--sel);color:var(--sel-t);box-shadow:inset 0 0 0 1px var(--accent)}
.ob svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ob.t{font-size:13px;font-weight:700;width:auto;padding:0 9px}
#opac{width:100%;accent-color:var(--accent)}
#fontBtn{width:100%;height:36px;border-radius:8px;background:var(--hover);padding:0 10px;display:flex;align-items:center;justify-content:space-between;font-size:18px}
#fontBtn:after{content:"\25BE";font-size:12px;color:var(--muted)}
#fontList{display:none;margin-top:6px;max-height:240px;overflow:auto;border:1px solid var(--border);border-radius:8px;scrollbar-width:thin}
#fontList.open{display:block}
.fo{display:flex;justify-content:space-between;align-items:baseline;width:100%;text-align:left;padding:5px 10px;font-size:17px;line-height:1.25;gap:6px}.fo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fo:hover{background:var(--hover)}
.fo.on{background:var(--sel);color:var(--sel-t)}
.fo small{font:600 10px var(--ui);color:var(--muted);margin-left:8px;white-space:nowrap}
#fsz{width:64px;height:32px;border-radius:7px;border:1px solid var(--border);background:var(--panel);color:var(--text);padding:0 6px;font-family:inherit}
#bl{left:12px;bottom:12px;display:flex;gap:8px;background:none;box-shadow:none}
.grp{display:flex;align-items:center;background:var(--panel);border-radius:10px;box-shadow:var(--shadow);padding:2px}
#zl{min-width:52px;height:32px;font-size:13px;font-weight:600;border-radius:7px}
#zl:hover{background:var(--hover)}
#br{right:12px;bottom:12px}
#help{width:36px;height:36px;border-radius:50%;font-weight:800;font-size:16px;background:var(--panel);box-shadow:var(--shadow)}
#welcome{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:1;text-align:center;gap:14px;color:var(--muted)}
#welcome img{height:110px;opacity:.9}
body.dark #welcome img{filter:invert(1) hue-rotate(180deg)}
#welcome p{font-family:"Caveat","Kalam",cursive;font-size:26px;line-height:1.25}
#welcome.hide{display:none}
#hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);font-size:12px;color:var(--muted);background:var(--panel);border-radius:8px;box-shadow:var(--shadow);padding:6px 12px;z-index:9;display:none}
#editor{position:fixed;display:none;z-index:20;background:transparent;border:none;outline:1px dashed var(--accent);resize:none;overflow:hidden;white-space:pre;padding:0;margin:0;line-height:1.25;-webkit-user-select:text;user-select:text}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:none;align-items:center;justify-content:center}
#modal.open{display:flex}
#modal .box{background:var(--panel);border-radius:14px;padding:22px 26px;max-width:620px;width:92%;max-height:86vh;overflow:auto;box-shadow:var(--shadow)}
#modal h3{font-size:20px;margin-bottom:12px}
#modal table{width:100%;border-collapse:collapse;font-size:14px}
#modal td{padding:5px 4px;border-bottom:1px solid var(--border)}
#modal td:last-child{text-align:right;font-weight:700;color:var(--sel-t)}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#232329;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;z-index:50;display:none}
@media(max-width:820px){#menuWrap,#right{width:auto}#logo{display:none}#tools{margin:0;flex-wrap:wrap;max-width:calc(100vw - 150px)}#props{top:auto;bottom:60px;max-height:45vh}}
html,body{overscroll-behavior:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.cbtn{background:var(--panel);box-shadow:var(--shadow);height:40px;padding:0 12px;border-radius:10px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:7px;color:var(--text)}
.cbtn:hover{background:var(--hover)}
.cbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cdot{width:8px;height:8px;border-radius:50%;background:#f08c00}.cdot.live{background:#2f9e44}
.cbtn .cn{font-size:13px}
.sbtn{height:40px;padding:0 16px;border-radius:10px;background:var(--hover);font-weight:700;font-size:14px}
.sbtn:hover{background:var(--sel)}
.cp{font-size:14px;line-height:1.5;margin-bottom:12px;color:var(--muted)}
.cn{font-size:12.5px;line-height:1.45;margin-top:12px;color:var(--muted)}
.cl{display:flex;flex-direction:column;gap:4px;font-size:13px;margin-bottom:14px;font-weight:600}
#modal input{height:38px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text);padding:0 10px;font:inherit;width:100%;-webkit-user-select:text;user-select:text}
.cact{display:flex;gap:8px;flex-wrap:wrap}
#lib{right:12px;top:64px;width:274px;max-height:calc(100vh - 140px);display:none;flex-direction:column;padding:8px;gap:8px}
#lib.open{display:flex}
.lh{display:flex;gap:4px;align-items:center}
.tab{height:30px;padding:0 10px;border-radius:7px;font-weight:700;font-size:13px;color:var(--muted)}
.tab:hover{background:var(--hover)}.tab.on{background:var(--sel);color:var(--sel-t)}
.lg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;overflow:auto;scrollbar-width:thin;padding:2px}
.tile{background:var(--hover);border-radius:8px;padding:4px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.tile:hover{background:var(--sel)}
.tile canvas{width:100%;aspect-ratio:3/2;display:block}
.tile span{font-size:11px;font-weight:600;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
@media(pointer:coarse){.ib .k{display:none}.ib{width:40px;height:40px}}
@media(max-width:820px){
 #right{min-width:0}#collabBtn .lbl{display:none}#exportBtn{padding:0 12px}
 #tools{position:fixed!important;bottom:12px;left:8px;right:8px;top:auto;margin:0;max-width:none;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;scrollbar-width:none;z-index:12}
 #tools::-webkit-scrollbar{display:none}
 #tools .ib{flex:none}
 #bl{bottom:72px}#br{display:none}#hint{bottom:128px}
 #props{left:8px;right:8px;width:auto;top:auto;bottom:120px;max-height:40vh}
 #lib{left:8px;right:8px;top:auto;bottom:118px;width:auto;max-height:42vh}
 .lg{grid-template-columns:repeat(4,1fr)}
}

#board{z-index:2}#welcome{z-index:0}#scene{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}#cursorLayer{position:fixed;inset:0;width:100%;height:100%;z-index:35;pointer-events:none}
#props{padding-top:44px}#modal .box{position:relative;padding-top:52px}.panelClose{position:absolute;right:6px;top:6px;min-width:36px;min-height:36px;font-size:25px;border-radius:8px;background:var(--hover);z-index:2}
.mediaNode{position:absolute;transform-origin:0 0}.audioCard{display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;overflow:hidden;color:var(--text)}.audioCard span{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.audioCard audio{width:100%;height:40px;pointer-events:auto}
.gifgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}.gifgrid button{width:100%;padding:6px;background:var(--hover);border-radius:10px}.gifgrid img{width:100%;height:110px;object-fit:contain}.gifgrid span{display:block;font-size:11px;word-break:break-word}.gifgrid a{font-size:11px;color:var(--sel-t)}.mediaActions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.mediaNote{font-size:12px;color:var(--muted);line-height:1.5;margin:12px 0}@media(max-width:600px){.gifgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div id="scene"></div><canvas id="board"></canvas><canvas id="cursorLayer"></canvas>
<div id="welcome"><img src="logo.svg" alt="GHDraw"><p id="wtxt"></p></div>
<div id="top">
  <div id="menuWrap">
    <button class="ib" id="menuBtn" aria-label="Menu"></button>
    <img id="logo" src="logo.svg" alt="GHDraw">
    <div id="menu" class="panel"></div>
  </div>
  <div id="tools" class="panel"></div>
  <div id="right"><button class="cbtn" id="collabBtn"></button><button class="pbtn" id="exportBtn"></button></div>
</div>
<div id="props" class="panel"></div>
<div id="lib" class="panel"></div>
<div id="bl" class="panel">
  <div class="grp"><button class="ib" id="zout" style="width:32px;height:32px">-</button><button id="zl">100%</button><button class="ib" id="zin" style="width:32px;height:32px">+</button></div>
  <div class="grp"><button class="ib" id="undo" style="width:32px;height:32px"></button><button class="ib" id="redo" style="width:32px;height:32px"></button></div>
</div>
<div id="br" class="panel" style="background:none;box-shadow:none"><button id="help">?</button></div>
<div id="hint"></div>
<textarea id="editor" spellcheck="false" wrap="off"></textarea>
<div id="modal"><div class="box"><button id="modalX" class="panelClose" aria-label="Close">×</button><div id="modalBox"></div></div></div>
<input id="mediaIn" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
<div id="toast"></div>
<input type="file" id="fileIn" accept=".ghdraw,.json,application/json" style="display:none">

function doResize(p,keep){
  const{h,b,orig}=drag;let l=b.x,r=b.x+b.w,tp=b.y,bt=b.y+b.h;

  let sx=b.w>1e-6?(r-l)/b.w:1,sy=b.h>1e-6?(bt-tp)/b.h:1;
  const horiz=h.includes('w')||h.includes('e'),vert=h.includes('n')||h.includes('s');
  if(!horiz)sx=(keep||single)?sy:1;
  if(!vert)sy=(keep||single)?sx:1;
  if((keep||single)&&horiz&&vert){const m=Math.max(Math.abs(sx),Math.abs(sy));sx=Math.sign(sx||1)*m;sy=Math.sign(sy||1)*m}
  const ax=h.includes('w')?b.x+b.w:b.x,ay=h.includes('n')?b.y+b.h:b.y;
  const mx=x=>ax+(x-ax)*sx,my=y=>ay+(y-ay)*sy;
  for(const o of orig){
    const e=els.find(x=>x.id===o.id);if(!e)continue;
    if(isLin(e))e.pts=o.pts.map(q=>[mx(q[0]),my(q[1]),...q.slice(2)]);
    else if(e.type==='text'){
      const k=Math.max(.05,Math.abs(sy));e.size=Math.max(6,Math.min(400,Math.round(o.size*k)));measure(e);
      const x1=mx(o.x),y1=my(o.y);e.x=sx<0?x1-e.w:x1;e.y=sy<0?y1-e.h:y1;
    }else{const x1=mx(o.x),x2=mx(o.x+o.w),y1=my(o.y),y2=my(o.y+o.h);e.x=Math.min(x1,x2);e.y=Math.min(y1,y2);e.w=Math.abs(x2-x1);e.h=Math.abs(y2-y1)}
  }
}

  if(e.type==='text'){e.font=defaults.font;measure(e);if(e.__c){e.x=e.__c[0]-e.w/2;e.y=e.__c[1]-e.h/2;delete e.__c}}
  if(e.type==='pen')e.rough=0;
  return e;
}
function drawPreview(cn,gen){
  const list=gen().map(d=>fin(d,'p')),b=unionBox(list),c=cn.getContext('2d');
  const pad=8,s=Math.min((cn.width-pad*2)/Math.max(b.w,1),(cn.height-pad*2)/Math.max(b.h,1),1.2);
  c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,cn.width,cn.height);
  c.translate((cn.width-b.w*s)/2-b.x*s,(cn.height-b.h*s)/2-b.y*s);c.scale(s,s);
  for(const e of list){e.sw=Math.max(e.sw,1.4/s);drawEl(c,e)}
}

const lastSent=new Map(),foreign=new Set(),remoteCur=new Map();let lastOrd='';

const ser=e=>{const c=Object.assign({},e);delete c.__bak;delete c.__new;delete c.lw;if(c.type==='text'){delete c.w;delete c.h}return JSON.stringify(c)};
function loadPeer(){
  if(window.Peer)return Promise.resolve();
  const urls=['https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js','https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'];
  let i=0;
  return new Promise((res,rej)=>{const next=()=>{if(i>=urls.length)return rej(new Error('peerjs'));const s=document.createElement('script');s.src=urls[i++];s.onload=res;s.onerror=()=>{s.remove();next()};document.head.appendChild(s)};next()});
}
const PEER_OPTS={config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}]}};
const linkFor=id=>location.href.split('#')[0]+'#room='+id;
function bcast(m,except){const s=JSON.stringify(m);for(const c of conns)if(c!==except&&c.open)try{c.send(s)}catch(_){}}

function snapEls(){return els.filter(e=>!('__bak' in e)).map(e=>JSON.parse(ser(e)))}
function schedPush(){
  if(!collabOn||!conns.length||pushT)return;
  pushT=setTimeout(()=>{pushT=0;collabPush()},50);
}
function collabPush(){
  if(!collabOn||!conns.length)return;
  const cur=new Map(),ch=[];
  for(const e of els){
    if('__bak' in e){if(lastSent.has(e.id))cur.set(e.id,lastSent.get(e.id));continue}
    const s=ser(e);cur.set(e.id,s);if(lastSent.get(e.id)!==s)ch.push(JSON.parse(s));
  }
  const del=[];for(const id of lastSent.keys())if(!cur.has(id))del.push(id);
  const ord=els.map(e=>e.id).join(',');
  if(!ch.length&&!del.length&&ord===lastOrd)return;
  const m={t:'upd',els:ch,del};if(ord!==lastOrd)m.ord=els.map(e=>e.id);
  lastOrd=ord;lastSent.clear();cur.forEach((v,k)=>lastSent.set(k,v));
  bcast(m);
}
function setLast(){lastSent.clear();for(const e of els)if(!('__bak' in e))lastSent.set(e.id,ser(e));lastOrd=els.map(e=>e.id).join(',')}
let remoteSaveT=0;
function applyUpd(m){
  if(isHost){clearTimeout(remoteSaveT);remoteSaveT=setTimeout(()=>{if(collabOn&&isHost)save()},400)}
  if(m.del&&m.del.length){const d=new Set(m.del);els=els.filter(e=>!d.has(e.id));d.forEach(id=>{sel.delete(id);lastSent.delete(id);foreign.delete(id)})}
  for(const r of m.els||[]){
    const i=els.findIndex(e=>e.id===r.id);
    if(i>=0&&editing&&els[i]===editing)continue;
    if(r.type==='text')measure(r);
    if(i<0){els.push(r);foreign.add(r.id)}else els[i]=r;
    lastSent.set(r.id,ser(r));
  }
  if(m.ord){const pos=new Map(m.ord.map((id,i)=>[id,i]));const known=els.filter(e=>pos.has(e.id)).sort((a,b)=>pos.get(a.id)-pos.get(b.id));const extra=els.filter(e=>!pos.has(e.id));els=known.concat(extra)}
  lastOrd=els.map(e=>e.id).join(',');
  sel=new Set([...sel].filter(id=>els.some(e=>e.id===id)));
  if(sel.size)buildProps();
  render();
}
function onMsg(raw,from){
  let m;try{m=typeof raw==='string'?JSON.parse(raw):raw}catch(_){return}
  if(m.t==='full'){
    if(els.length&&!window.__gotFull){try{localStorage.setItem('ghdraw:backup',JSON.stringify(els))}catch(_){}}
    window.__gotFull=true;
    els=m.els||[];els.forEach(e=>{if(e.type==='text')measure(e);foreign.add(e.id)});sel=new Set();
    setLast();hist=[snap()];hidx=0;syncUI();render();toast(L2('Ortak çizime bağlandın','Connected to the shared board'));
  }else if(m.t==='upd'){applyUpd(m);if(isHost)bcast(m,from)}
  else if(m.t==='cur'){remoteCur.set(m.id,{x:m.x,y:m.y,n:m.n,c:m.c,ts:Date.now()});if(isHost)bcast(m,from);render()}
  else if(m.t==='bye'){remoteCur.delete(m.id);if(isHost)bcast(m,from);render()}
  else if(m.t==='n'){peersN=m.n;setStatus()}
}
function hostAttach(c){
  c.on('open',()=>{
    conns.push(c);
    try{c.send(JSON.stringify({t:'full',els:snapEls()}))}catch(_){}
    peersN=conns.length+1;bcast({t:'n',n:peersN});setStatus();toast(L2('Biri katıldı','Someone joined'));
  });
  c.on('data',d=>onMsg(d,c));
  const gone=()=>{conns=conns.filter(x=>x!==c);remoteCur.delete(c.peer);bcast({t:'bye',id:c.peer});peersN=conns.length+1;bcast({t:'n',n:peersN});setStatus();render()};
  c.on('close',gone);c.on('error',gone);
}
async function collabStart(name){
  myName=name||myName;localStorage.setItem('ghdraw:name',myName);
  try{await loadPeer()}catch(_){toast(L2('Ortak çizim kütüphanesi yüklenemedi (internet?)','Could not load the collaboration library (offline?)'));return}
  const id=localStorage.getItem('ghdraw:hostRoom')&&location.hash.includes(localStorage.getItem('ghdraw:hostRoom'))?localStorage.getItem('ghdraw:hostRoom'):'ghd'+Math.random().toString(36).slice(2,12);
  startHost(id,0);
}
function startHost(id,tries){
  if(peer){try{peer.destroy()}catch(_){}}
  peer=new Peer(id,PEER_OPTS);isHost=true;roomId=id;
  peer.on('open',()=>{
    collabOn=true;isHost=true;conns=[];peersN=1;setLast();
    localStorage.setItem('ghdraw:hostRoom',id);history.replaceState(null,'',linkFor(id));
    setStatus();
  });
  peer.on('connection',hostAttach);
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(_){}});
  peer.on('error',e=>{
    if(e.type==='unavailable-id'&&tries<6){setTimeout(()=>startHost(id,tries+1),3000);return}
    toast(L2('Bağlantı hatası: ','Connection error: ')+e.type);
  });
}
async function collabJoin(id){
  try{await loadPeer()}catch(_){toast(L2('Ortak çizim kütüphanesi yüklenemedi (internet?)','Could not load the collaboration library (offline?)'));return}
  if(peer){try{peer.destroy()}catch(_){}}
  roomId=id;isHost=false;collabOn=true;retry=0;peersN=1;setStatus();
  peer=new Peer(PEER_OPTS);
  peer.on('open',()=>guestConnect());
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(_){}});
  peer.on('error',e=>{
    if(e.type==='peer-unavailable'){if(retry<6){retry++;setTimeout(guestConnect,3000)}else{toast(L2('Oda bulunamadı. Linki açan kişinin sayfası açık olmalı.','Room not found. The host must keep the page open.'));collabStop(true)}}
    else toast(L2('Bağlantı hatası: ','Connection error: ')+e.type);
  });
}
function guestConnect(){
  if(!collabOn||isHost||!peer||peer.destroyed)return;
  const c=peer.connect(roomId,{reliable:true});
  c.on('open',()=>{retry=0;hostConn=c;conns=[c];setStatus()});
  c.on('data',d=>onMsg(d,c));
  const gone=()=>{if(hostConn===c){hostConn=null;conns=[];remoteCur.clear();setStatus();if(collabOn&&!isHost&&retry<6){retry++;toast(L2('Bağlantı koptu, yeniden deniyorum...','Disconnected, retrying...'));setTimeout(guestConnect,3000)}else if(collabOn&&!isHost){toast(L2('Ortak çizim sona erdi. Çizimin sende kaldı.','The session ended. You keep your copy.'));collabStop(true)}}};
  c.on('close',gone);c.on('error',gone);
}
function collabStop(silent){
  if(peer){try{peer.destroy()}catch(_){}}
  peer=null;conns=[];hostConn=null;collabOn=false;const wasHost=isHost;isHost=false;peersN=1;remoteCur.clear();foreign.clear();lastSent.clear();window.__gotFull=false;
  if(wasHost)localStorage.removeItem('ghdraw:hostRoom');
  history.replaceState(null,'',location.href.split('#')[0]);
  save();setStatus();render();if(!silent)toast(L2('Ortak çizim kapatıldı','Collaboration stopped'));
}
function sendCursor(p){

  bcast({t:'cur',id:peer&&peer.id,x:p.x,y:p.y,n:myName,c:myColor});

function drawCursors(ctx){
  if(!remoteCur.size)return;

    if(now-c.ts>6000){remoteCur.delete(id);continue}
    const x=c.x*cam.z+cam.x,y=c.y*cam.z+cam.y;
    ctx.save();ctx.fillStyle=c.c;ctx.strokeStyle='#fff';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+4,y+16);ctx.lineTo(x+8,y+11);ctx.lineTo(x+15,y+10);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.font='600 12px Nunito,system-ui,sans-serif';const w=ctx.measureText(c.n).width+12;
    ctx.fillStyle=c.c;ctx.beginPath();ctx.roundRect?ctx.roundRect(x+12,y+16,w,20,6):ctx.rect(x+12,y+16,w,20);ctx.fill();
    ctx.fillStyle='#fff';ctx.textBaseline='middle';ctx.fillText(c.n,x+18,y+26.5);ctx.restore();
  }
}

/* ---- touch: pinch zoom, double tap, palm rejection ---- */
const tp=new Map();let pinch=null,penSeen=0,lastTap={t:0,x:0,y:0};
function dblAt(sx,sy){
  const p=toW(sx,sy),e=topAt(p.x,p.y);
  if(e&&e.type==='text'){sel=new Set([e.id]);startEdit(e,false)}
  
}
cv.addEventListener('pointerdown',ev=>{
  if(ev.pointerType==='pen')penSeen=Date.now();
  if(ev.pointerType!=='touch')return;
  tp.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(tp.size>=2){
    if(drag){if(drag.kind==='erase'){els.forEach(e=>{if('__bak' in e){e.opacity=e.__bak;delete e.__bak}});erased=null}drag=null;marquee=null}
    const a=[...tp.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1,cx=(a[0].x+a[1].x)/2,cy=(a[0].y+a[1].y)/2;
    pinch={d0:d,z0:cam.z,w:toW(cx,cy)};render();
    ev.stopImmediatePropagation();return;
  }
  const n=Date.now();
  if(tool==='select'&&n-lastTap.t<350&&Math.hypot(ev.clientX-lastTap.x,ev.clientY-lastTap.y)<28){lastTap.t=0;ev.stopImmediatePropagation();ev.preventDefault();dblAt(ev.clientX,ev.clientY);return}
  lastTap={t:n,x:ev.clientX,y:ev.clientY};
  if(n-penSeen<4000&&!['hand','select'].includes(tool)){
    $('#menu').classList.remove('open');
    drag={kind:'pan',sx:ev.clientX,sy:ev.clientY,cx:cam.x,cy:cam.y};ev.stopImmediatePropagation();
  }
},true);
cv.addEventListener('pointermove',ev=>{
  if(ev.pointerType!=='touch'||!tp.has(ev.pointerId))return;
  tp.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(pinch&&tp.size>=2){
    const a=[...tp.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1,cx=(a[0].x+a[1].x)/2,cy=(a[0].y+a[1].y)/2;
    const z=Math.max(.1,Math.min(8,pinch.z0*d/pinch.d0));cam.z=z;cam.x=cx-pinch.w.x*z;cam.y=cy-pinch.w.y*z;
    if(editing)applyEditorStyle();render();ev.stopImmediatePropagation();
  }
},true);
const tpEnd=ev=>{if(ev.pointerType!=='touch')return;tp.delete(ev.pointerId);if(tp.size<2&&pinch){pinch=null;save();ev.stopImmediatePropagation()}};
cv.addEventListener('pointerup',tpEnd,true);cv.addEventListener('pointercancel',tpEnd,true);
cv.addEventListener('pointermove',ev=>{if(collabOn)sendCursor(toW(ev.clientX,ev.clientY))});

/* GIPHY URLs are transient: board data contains only the GIF id, not media bytes/URLs. */
const GIPHY_KEY='D4vnuR8AFvAE9W061LVcwqOc7vDEcORY';
const giphyLive=new Map();

async function giphyFetch(path,params={},signal){const r=await fetch(giphyURL(path,params),{signal,cache:'no-store'});if(!r.ok){const e=new Error();e.status=r.status;throw e}const d=await r.json();if(d.meta?.status!==200){const e=new Error();e.status=d.meta?.status;throw e}return d}

function giphyCredit(e){const a=mk('a');a.href=giphyLive.get(e.giphyId)?.url||'https://giphy.com/';a.target='_blank';a.rel='noopener noreferrer';a.textContent='GIPHY: '+(e.name||e.giphyId)+(e.credit?.artist?' - '+e.credit.artist:'');return a}
async function addGiphy(g){const im=giphyRendition(g);if(!im?.url)throw Error();giphyLive.set(g.id,{src:im.url,url:g.url,artist:g.user?.display_name||g.username||'',loading:false});const img=getImage(im.url);if(!img.complete)await new Promise((res,rej)=>{img.addEventListener('load',res,{once:true});img.addEventListener('error',rej,{once:true})});if(!img.naturalWidth)throw Error();const w=Math.min(480,img.naturalWidth),h=w*img.naturalHeight/img.naturalWidth,p=toW(W/2,H/2);const e={id:uid(),type:'image',giphyId:g.id,name:g.title||'GIF',credit:{provider:'GIPHY',artist:g.user?.display_name||g.username||''},x:p.x-w/2,y:p.y-h/2,w,h,opacity:100};els.push(e);setTool('select');sel=new Set([e.id]);commit();render()}

const imgCache=new Map(),sceneNodes=new Map();
function getImage(src){if(!src)return {complete:true,naturalWidth:0};if(!imgCache.has(src)){const im=new Image();im.crossOrigin='anonymous';im.onload=()=>render();im.onerror=()=>{};im.src=src;imgCache.set(src,im)}return imgCache.get(src)}
function syncScene(){
 const scene=$('#scene'),active=new Set();let prev=null;
 for(const e of els){

const MAX_MEDIA=4*1024*1024;
function readData(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
async function addRemoteImage(url,name,credit){const r=await fetch(url);if(!r.ok)throw Error();const blob=await r.blob();if(blob.size>MAX_MEDIA)throw Error();const src=await readData(blob);await addMedia(src,'image',name,credit)}
async function addMedia(src,type,name,credit){
 let w=320,h=180;if(type==='image'){const im=getImage(src);if(!im.complete)await new Promise((res,rej)=>{im.addEventListener('load',res,{once:true});im.addEventListener('error',rej,{once:true})});if(!im.naturalWidth)throw Error();w=Math.min(480,im.naturalWidth);h=w*im.naturalHeight/im.naturalWidth}
 if(type==='video'){const v=document.createElement('video');v.preload='metadata';v.src=src;await new Promise((res,rej)=>{v.onloadedmetadata=res;v.onerror=rej});w=Math.min(480,v.videoWidth||320);h=w*(v.videoHeight||180)/(v.videoWidth||320)}
 const p=toW(W/2,H/2),e={id:uid(),type,src,name,credit,x:p.x-w/2,y:p.y-h/2,w,h,opacity:100};els.push(e);setTool('select');sel=new Set([e.id]);commit();render();
}
